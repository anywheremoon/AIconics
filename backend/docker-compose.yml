services:
  api:
    build: .
    container_name: risk_api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside Compose, "localhost" is the API container itself. Use the
      # PostgreSQL service name so Docker DNS resolves the database correctly.
      DATABASE_URL: postgresql+psycopg2://risk_user:risk_password@postgres:5432/risk_db
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: risk_postgres
    environment:
      POSTGRES_USER: risk_user
      POSTGRES_PASSWORD: risk_password
      POSTGRES_DB: risk_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U risk_user -d risk_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  neo4j:
    image: neo4j:5
    container_name: risk_neo4j
    environment:
      NEO4J_AUTH: neo4j/test1234
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  neo4j_data: